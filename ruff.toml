# This is a configuration file for the ruff python linter and
# formatter. This file is meant to be used by extending it per project via a
# ruff.toml file in the repository root, which contains something similar
# to:
#
# ,---- ruff.toml
# | extend = ".lib/ruff/strict.toml"
# | lint.extend-ignore = ["F841"]
# | lint.extend-select = ["SIM300"]
# `----
#
#

force-exclude = true
line-length = 99
target-version = "py311"
required-version = ">=0.13.2"
output-format = "concise"


# rules: https://beta.ruff.rs/docs/rules
lint.select = [
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "B",      # flake8-bugbear
    "C4",     # flake8-comrehensions
    "C90",    # mccabe (complexity)
    "E",      # pycodestyle error
    "EXE",    # flake8-executable
    "F",      # pyflakes
    "G",      # flake8-logging-format
    "I",      # isort
    "ISC",    # flake8-implicit-str-concat
    "N",      # pep8-naming
    "PGH004", # disalloy blanket noqa
    "PIE",    # flake8-pie
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "RUF",    # Ruff-specific rules
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # pycodestyle warning
]

lint.ignore = [
    "C408", # unnecessary-collection-call
]

lint.mccabe.max-complexity = 20
lint.flake8-tidy-imports.ban-relative-imports = "all"
lint.pep8-naming.classmethod-decorators = [
    "pydantic.validator",
    "pydantic.root_validator",
    "sqlalchemy.orm.declared_attr",
]
lint.per-file-ignores."**/migrations/*.py" = [
    "N806",
] # ignore variable in function should be lowercase
# WME ingest CLI uses lazy imports for ``google-cloud-bigquery`` (declared as
# an *optional* extra in pyproject.toml under ``mwlib[bigquery]``) so the
# default install stays slim. Top-level imports would force the heavy
# Google/gRPC stack on every consumer. The complexity warnings reflect a
# real CLI orchestrator that's been deliberately kept linear; refactoring is
# out of scope for the chunked-ingest work.
lint.per-file-ignores."src/mwlib/apps/fetch_wikimedia_snapshot.py" = [
    "PLC0415", # `import` should be at the top-level (lazy optional-dep imports)
    "PLR0912", # too many branches (CLI orchestrator)
    "PLR0913", # too many arguments (load-job helpers)
    "PLR0915", # too many statements (CLI orchestrator)
]
# Template-magic dispatch. Function names like ``TITLEPARTS`` / ``IFERROR``
# match MediaWiki magic-word names by design — the dispatcher maps
# ``{{TITLEPARTS:…}}`` to ``ParserFunctions.TITLEPARTS`` by string match —
# so renaming for PEP-8 would break wiki templates. The rest of the rules
# below cover legacy patterns (lazy imports, unnecessary assigns, f-string
# preferences) in a file that pre-dates the modern ruff config.
lint.per-file-ignores."src/mwlib/parser/templ/magics.py" = [
    "N802",    # function name should be lowercase (MediaWiki magic-word convention)
    "N805",    # first method arg name (legacy classmethod-as-function patterns)
    "RET504",  # unnecessary assignment before return
    "PLR2004", # magic values in comparisons
    "PLC0415", # lazy imports
    "UP031",   # `.format()` vs f-string
    "RUF012",  # mutable class attribute should be ClassVar
    "G004",    # f-string in logging call
]

# Extend the selected rules
lint.extend-select = []

# Extend the ignores rules
lint.extend-ignore = [
    "ANN", # type annotations
]
